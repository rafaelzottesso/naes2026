{% load crispy_forms_tags fin_tags %}
{% quantidade_filtros_ativos request.GET as total_filtros %}

<button type="button" class="btn btn-outline-secondary position-relative fin-filtro-botao"
        aria-label="{% if total_filtros %}Filtros, {{ total_filtros }} em uso{% else %}Abrir filtros{% endif %}"
        title="Filtros" aria-haspopup="dialog" data-bs-toggle="tooltip"
        data-template-filtros="filtrosListaTemplate" data-url-limpar="{{ request.path }}">
    <i class="bi bi-funnel" aria-hidden="true"></i>
    {% if total_filtros %}
    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill text-bg-danger fin-filtro-badge" aria-hidden="true">{{ total_filtros }}</span>
    {% endif %}
</button>

<template id="filtrosListaTemplate">
    <form id="formFiltrosLista" class="row row-cols-1 row-cols-md-auto g-3 align-items-end" action="" method="get">
        {{ filter.form|crispy }}
    </form>
</template>
