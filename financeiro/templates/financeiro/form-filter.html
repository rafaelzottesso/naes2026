{% load crispy_forms_tags %}

<div class="accordion mb-4" id="filtrosFinanceiro">
    <div class="accordion-item border rounded-3 shadow-sm">
        <h2 class="accordion-header" id="tituloFiltrosFinanceiro">
                <button class="accordion-button collapsed rounded-3" type="button" data-bs-toggle="collapse"
                    data-bs-target="#conteudoFiltrosFinanceiro" aria-expanded="false"
                    aria-controls="conteudoFiltrosFinanceiro">
                <i class="bi bi-funnel me-2" aria-hidden="true"></i>Filtros
            </button>
        </h2>
        <div id="conteudoFiltrosFinanceiro" class="accordion-collapse collapse"
             aria-labelledby="tituloFiltrosFinanceiro">
            <div class="accordion-body">
                {# method="get": a busca vai para a URL, e não fica escondida em um POST #}
                <form class="row row-cols-1 row-cols-md-auto g-3 align-items-end" action="" method="get">
                    {# Sem csrf_token: ele só é necessário em formulários POST #}
                    {{ filter.form|crispy }}

                    <div class="col d-flex flex-wrap gap-2">
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-search"></i> Filtrar
                        </button>
                        {# O botão "Limpar" volta para a mesma página, sem os parâmetros da busca #}
                        <a href="{{ request.path }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-lg"></i> Limpar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
